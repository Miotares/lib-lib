<body>
  <div id="app">
    <header>
      <div class="header-title">
        <h1>lib-lib.org</h1>
        <p>Freie Übersetzungen libertärer Werke</p>
      </div>
      <div class="header-controls">
        <input type="text" id="search-input" placeholder="SUCHE..." aria-label="Suche nach Titel oder Autor">
        <select id="author-filter" aria-label="Nach Autor filtern">
          <option value="all">ALLE AUTOREN</option>
        </select>
        <select id="sort-select" aria-label="Sortieren">
          <option value="date-desc">JAHR (NEU → ALT)</option>
          <option value="date-asc">JAHR (ALT → NEU)</option>
          <option value="title-asc">TITEL (A → Z)</option>
        </select>
        <button id="view-toggle" class="btn-icon" aria-label="Ansicht wechseln">LISTENANSICHT</button>
      </div>
    </header>

    <main>
      <div id="result-count" class="result-count" aria-live="polite"></div>
      <div id="book-list" class="book-grid">
        <!-- Books will be rendered here -->
      </div>
    </main>

    <div id="book-modal" class="book-modal" role="dialog" aria-modal="true" hidden>
      <div class="book-modal-backdrop"></div>
      <div class="book-modal-content">
        <button class="book-modal-close" aria-label="Schließen">&times;</button>
        <div class="book-modal-body"></div>
      </div>
    </div>
